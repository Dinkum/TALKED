<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Transfer test: held-out skills reuse the same frozen packet interface and frozen reader">
  <rect width="1200" height="560" fill="#ffffff"/>
  <style>
    .title { font: 700 32px Arial, Helvetica, sans-serif; fill: #111827; }
    .phase { font: 700 23px Arial, Helvetica, sans-serif; fill: #111827; }
    .col { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: .10em; fill: #64748b; }
    .label { font: 700 22px Arial, Helvetica, sans-serif; fill: #111827; }
    .small { font: 500 17px Arial, Helvetica, sans-serif; fill: #334155; }
    .mini { font: 700 15px Arial, Helvetica, sans-serif; fill: #475569; }
    .slot { font: 700 15px Arial, Helvetica, sans-serif; fill: #7c2d12; }
    .box { rx: 12; stroke-width: 2.5; }
    .arrow { stroke: #111827; stroke-width: 4; marker-end: url(#arrowhead); }
    .freeze { stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#softArrow); }
    .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#111827"/>
    </marker>
    <marker id="softArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="70" y="58" class="title">Transfer test: held-out skills use the same frozen packet interface</text>

  <text x="200" y="104" text-anchor="middle" class="col">specialists</text>
  <text x="580" y="104" text-anchor="middle" class="col">packet ABI</text>
  <text x="965" y="104" text-anchor="middle" class="col">reader</text>

  <text x="80" y="143" class="phase">Source training</text>
  <rect x="80" y="165" width="240" height="108" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="200" y="204" text-anchor="middle" class="label">source specialists</text>
  <text x="200" y="234" text-anchor="middle" class="small">checksum + retrieval</text>

  <line x1="338" y1="219" x2="438" y2="219" class="arrow"/>

  <rect x="455" y="151" width="250" height="134" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="580" y="190" text-anchor="middle" class="label">train packet ABI</text>
  <rect x="532" y="207" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <rect x="596" y="207" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <text x="559" y="231" text-anchor="middle" class="slot">s1</text>
  <text x="623" y="231" text-anchor="middle" class="slot">s2</text>
  <text x="580" y="266" text-anchor="middle" class="mini">typed decoders: state + margin</text>

  <line x1="722" y1="219" x2="824" y2="219" class="arrow"/>

  <rect x="840" y="165" width="250" height="108" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="965" y="204" text-anchor="middle" class="label">train packet reader</text>
  <text x="965" y="234" text-anchor="middle" class="small">tiny token transformer</text>

  <line x1="580" y1="287" x2="580" y2="355" class="freeze"/>
  <line x1="965" y1="275" x2="965" y2="368" class="freeze"/>
  <line x1="70" y1="315" x2="1130" y2="315" class="divider"/>

  <text x="80" y="358" class="phase">Held-out transfer</text>
  <rect x="80" y="381" width="240" height="108" class="box" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="200" y="420" text-anchor="middle" class="label">new specialists</text>
  <text x="200" y="450" text-anchor="middle" class="small">graph / max / count / rank</text>
  <text x="200" y="473" text-anchor="middle" class="mini">local adapters only</text>

  <line x1="338" y1="435" x2="438" y2="435" class="arrow"/>

  <rect x="455" y="368" width="250" height="134" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="580" y="407" text-anchor="middle" class="label">frozen packet ABI</text>
  <rect x="532" y="424" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <rect x="596" y="424" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <text x="559" y="448" text-anchor="middle" class="slot">s1</text>
  <text x="623" y="448" text-anchor="middle" class="slot">s2</text>
  <text x="580" y="483" text-anchor="middle" class="mini">same packet symbols</text>

  <line x1="722" y1="435" x2="824" y2="435" class="arrow"/>

  <rect x="840" y="381" width="250" height="108" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="965" y="420" text-anchor="middle" class="label">frozen reader</text>
  <text x="965" y="450" text-anchor="middle" class="small">predicts state, margin, relation</text>

  <rect x="802" y="508" width="288" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="946" y="529" text-anchor="middle" class="mini">controls: mask | shuffle | packet-only</text>
</svg>
