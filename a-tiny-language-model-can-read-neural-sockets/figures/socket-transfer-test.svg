<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Socket transfer test: train on source specialists, freeze the socket and reader, adapt held-out specialists into the socket, and evaluate controls">
  <rect width="1200" height="560" fill="#ffffff"/>
  <style>
    .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #111827; }
    .phase { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
    .label { font: 700 22px Arial, Helvetica, sans-serif; fill: #111827; }
    .small { font: 500 17px Arial, Helvetica, sans-serif; fill: #334155; }
    .mini { font: 600 15px Arial, Helvetica, sans-serif; fill: #334155; }
    .note { font: 600 17px Arial, Helvetica, sans-serif; fill: #475569; }
    .box { rx: 12; stroke-width: 2.5; }
    .arrow { stroke: #111827; stroke-width: 4; marker-end: url(#arrowhead); }
    .thin { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowheadSmall); }
    .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#111827"/>
    </marker>
    <marker id="arrowheadSmall" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="70" y="58" class="title">Transfer test: the reader never trains on the held-out skills</text>

  <text x="88" y="114" class="phase">Source side</text>
  <rect x="80" y="140" width="240" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="200" y="180" text-anchor="middle" class="label">source specialists</text>
  <text x="200" y="211" text-anchor="middle" class="small">checksum + retrieval</text>
  <line x1="335" y1="195" x2="440" y2="195" class="arrow"/>
  <rect x="455" y="128" width="250" height="135" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="580" y="166" text-anchor="middle" class="label">train packet ABI</text>
  <rect x="532" y="188" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <rect x="596" y="188" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <text x="559" y="212" text-anchor="middle" class="small">s1</text>
  <text x="623" y="212" text-anchor="middle" class="small">s2</text>
  <text x="580" y="246" text-anchor="middle" class="mini">typed decoders: state + margin</text>
  <line x1="720" y1="195" x2="825" y2="195" class="arrow"/>
  <rect x="840" y="140" width="250" height="110" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="965" y="180" text-anchor="middle" class="label">train packet reader</text>
  <text x="965" y="211" text-anchor="middle" class="small">tiny token transformer</text>

  <line x1="70" y1="296" x2="1130" y2="296" class="dash"/>
  <text x="88" y="340" class="phase">Held-out side</text>
  <rect x="80" y="365" width="240" height="110" class="box" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="200" y="404" text-anchor="middle" class="label">new specialists</text>
  <text x="200" y="434" text-anchor="middle" class="small">graph / max / count / rank</text>
  <text x="200" y="459" text-anchor="middle" class="mini">local adapters only</text>
  <line x1="335" y1="420" x2="440" y2="420" class="arrow"/>
  <rect x="455" y="353" width="250" height="135" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="580" y="391" text-anchor="middle" class="label">same frozen ABI</text>
  <rect x="532" y="413" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <rect x="596" y="413" width="54" height="36" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/>
  <text x="559" y="437" text-anchor="middle" class="small">s1</text>
  <text x="623" y="437" text-anchor="middle" class="small">s2</text>
  <text x="580" y="471" text-anchor="middle" class="mini">packet symbols only</text>
  <line x1="720" y1="420" x2="825" y2="420" class="arrow"/>
  <rect x="840" y="365" width="250" height="110" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="965" y="404" text-anchor="middle" class="label">same frozen reader</text>
  <text x="965" y="434" text-anchor="middle" class="small">predicts state, margin, relation</text>

  <line x1="965" y1="250" x2="965" y2="350" class="thin"/>
  <text x="985" y="306" class="note">freeze reader</text>
  <line x1="580" y1="263" x2="580" y2="348" class="thin"/>
  <text x="602" y="306" class="note">freeze ABI</text>

  <rect x="720" y="498" width="370" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="905" y="525" text-anchor="middle" class="small">controls: mask | shuffle | packet-only</text>
</svg>
